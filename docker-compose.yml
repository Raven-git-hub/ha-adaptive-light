# Adaptive Light - deployment
#
#   docker compose up -d
#
# No /share or /config mount is needed. The almanac reaches Home
# Assistant over the REST API rather than by writing a file for a
# command_line sensor to read, so the container never touches HA's
# filesystem. The only volume is its own data directory.

services:
  adaptive-light:
    build: .
    image: adaptive-light:latest
    container_name: adaptive-light
    restart: unless-stopped

    ports:
      - "8099:8099"

    volumes:
      # Config, SQLite database, CSV archive and generated YAML.
      # Everything except the CSV archive is rebuildable; back this up.
      - ./data:/data

    environment:
      # Timezone only affects log timestamps. The scheduler takes its
      # timezone, coordinates and sun times from Home Assistant, so the
      # two can never disagree about when sunset is.
      TZ: ${TZ:-Etc/UTC}

      AL_HA_URL: ${AL_HA_URL}
      AL_HA_TOKEN: ${AL_HA_TOKEN}
      AL_HA_VERIFY_SSL: ${AL_HA_VERIFY_SSL:-true}

      AL_DATA_DIR: /data
      AL_LOG_LEVEL: ${AL_LOG_LEVEL:-info}

    healthcheck:
      # Reports unhealthy if the HA websocket is down, not merely if the
      # process is alive - a container that is running but disconnected
      # is the failure worth surfacing.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/healthz', timeout=3).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
